name: Publicar pendientes Instagram

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Publicar pendientes
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          REPO_OWNER: jkastro031
          REPO_NAME: instagram-uploads-temp
          REPO_BRANCH: main
        run: python .github/scripts/publicar_pendientes_cloud.py

      - name: Guardar cambios (cola.json + borrado de videos publicados)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "publicar pendientes [skip ci]"
          git push
